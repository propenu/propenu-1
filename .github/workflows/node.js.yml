name: Backend CI/CD 1

on:
  push:
    branches:
      - deploy
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.js.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Install packages and build
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build backend services
        run: npm run build:backend

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/gateway/dist
            backend/services/ai-service/dist
            backend/services/payment-service/dist
            backend/services/property-service/dist
            backend/services/user-service/dist
            backend/services/ticket-service/dist

  deploy:
    name: Deploy and restart services
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deployment dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: backend

      - name: Create service environment files
        shell: bash
        env:
          GATEWAY_ENV: ${{ secrets.PRPPENU_GATEWAY_ENV }}
          PAYMENT_ENV: ${{ secrets.PRPPENU_PAYMENT_ENV }}
          PROPERTY_ENV: ${{ secrets.PRPPENU_PROPERTY_ENV }}
          USER_ENV: ${{ secrets.PRPPENU_USER_ENV }}
          TICKET_ENV: ${{ secrets.PRPPENU_TICKET_ENV }}
          AI_ENV: ${{ secrets.PRPPENU_AI_ENV }}
        run: |
          for variable in GATEWAY_ENV PAYMENT_ENV PROPERTY_ENV USER_ENV TICKET_ENV AI_ENV; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required GitHub secret for ${variable} is empty or missing."
              exit 1
            fi
          done

          umask 077
          printf '%s\n' "$GATEWAY_ENV" > backend/gateway/.env
          printf '%s\n' "$PAYMENT_ENV" > backend/services/payment-service/.env
          printf '%s\n' "$PROPERTY_ENV" > backend/services/property-service/.env
          printf '%s\n' "$USER_ENV" > backend/services/user-service/.env
          printf '%s\n' "$TICKET_ENV" > backend/services/ticket-service/.env
          printf '%s\n' "$AI_ENV" > backend/services/ai-service/.env

      - name: Verify Firebase credentials
        shell: bash
        run: |
          test -r /home/ubuntu/firebase-service-account.json || {
            echo "::error::Firebase credentials are missing or unreadable."
            exit 1
          }

      - name: Restart services with PM2
        shell: bash
        run: |
          command -v pm2 >/dev/null || {
            echo "::error::PM2 is not installed or is not available in PATH."
            exit 1
          }

          echo "Restarting PM2 as $(whoami) with PM2_HOME=${PM2_HOME:-$HOME/.pm2}"
          pm2 startOrReload backend/ecosystem.config.cjs --update-env
          pm2 status

          for service in gateway user-service property-service payment-service ai-service ticket-service; do
            status="$(pm2 jlist | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const name = process.argv[1];
                const app = JSON.parse(input).find(item => item.name === name);
                process.stdout.write(app?.pm2_env?.status || "missing");
              });
            ' "$service")"

            if [ "$status" != "online" ]; then
              echo "::error::PM2 service $service is $status after deployment."
              pm2 logs "$service" --lines 50 --nostream
              exit 1
            fi
          done

          pm2 save
